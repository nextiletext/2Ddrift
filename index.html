<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Grand Prix Drift Racer - 10 Massive Tracks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    canvas { display: block; outline: none; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 4px solid #ff3b30;
      z-index: 10;
    }
    h1 { font-size: 18px; margin-bottom: 8px; letter-spacing: 1px; }
    p { font-size: 14px; margin: 5px 0; color: #ddd; }
    select, button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 13px;
      color: #ccc;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>GRAND PRIX DRIFT</h1>
  <p>Circuit: 
    <select id="trackSelect">
      <option value="0">1. Silverstone Sweep (Fast GP)</option>
      <option value="1">2. Monza Temple of Speed</option>
      <option value="2">3. Suzuka Figure-8 Crossover</option>
      <option value="3">4. Monaco Harbor Tight</option>
      <option value="4">5. Spa-Francorchamps Forest</option>
      <option value="5">6. Interlagos Technical Twist</option>
      <option value="6">7. Nürburgring Endurance Loop</option>
      <option value="7">8. Daytona Tri-Oval Superspeedway</option>
      <option value="8">9. Laguna Seca Corkscrew</option>
      <option value="9">10. Abu Dhabi Yas Marina</option>
    </select>
  </p>
  <p>Lap: <span id="lap">1</span> &nbsp;|&nbsp; <button id="resetBtn">Reset Car (R)</button></p>
  <p>Time: <span id="time">0.00</span>s</p>
  <p>Best: <span id="best">--</span></p>
  <p>Speed: <span id="speed">0</span> MPH</p>
</div>

<div class="controls">
  <b>W / Up:</b> Gas &nbsp;|&nbsp; <b>S / Down:</b> Brake/Reverse &nbsp;|&nbsp; <b>A / D or Left / Right:</b> Steer &nbsp;|&nbsp; <b>Space:</b> Handbrake Drift &nbsp;|&nbsp; <b>R:</b> Reset to Track
</div>

<canvas id="game" tabindex="1"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
canvas.focus();

// Input tracking
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyR'].includes(e.code) || 
      [' ', 'w', 's', 'a', 'd', 'W', 'S', 'A', 'D', 'r', 'R'].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.code] = true;
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'KeyR' || e.key.toLowerCase() === 'r') resetCarToTrack();
});

window.addEventListener('keyup', e => {
  keys[e.code] = false;
  keys[e.key.toLowerCase()] = false;
});

// 10 Massive Grand Prix Circuits (4500 x 4500 world coordinates)
const rawTracks = [
  {
    name: "Silverstone Sweep",
    roadWidth: 230,
    points: [
      {x: 1200, y: 700}, {x: 2400, y: 650}, {x: 3600, y: 800}, {x: 3900, y: 1500},
      {x: 3400, y: 2100}, {x: 3800, y: 2900}, {x: 3400, y: 3700}, {x: 2300, y: 3800},
      {x: 1800, y: 3100}, {x: 1100, y: 3600}, {x: 650, y: 2800}, {x: 900, y: 1800}, {x: 750, y: 1100}
    ]
  },
  {
    name: "Monza Temple of Speed",
    roadWidth: 220,
    points: [
      {x: 900, y: 700}, {x: 3500, y: 700}, {x: 3900, y: 1000}, {x: 3700, y: 1600},
      {x: 2800, y: 1800}, {x: 3500, y: 2400}, {x: 3700, y: 3400}, {x: 3100, y: 3800},
      {x: 1400, y: 3700}, {x: 900, y: 3200}, {x: 1300, y: 2400}, {x: 750, y: 1600}
    ]
  },
  {
    name: "Suzuka Figure-8 Crossover",
    roadWidth: 210,
    points: [
      {x: 800, y: 900}, {x: 2000, y: 800}, {x: 2700, y: 1900}, {x: 3700, y: 2300},
      {x: 3900, y: 3300}, {x: 3000, y: 3800}, {x: 2300, y: 3000}, {x: 2100, y: 1800},
      {x: 1300, y: 2700}, {x: 650, y: 3300}, {x: 600, y: 2000}
    ]
  },
  {
    name: "Monaco Harbor Tight",
    roadWidth: 175,
    points: [
      {x: 1100, y: 750}, {x: 2200, y: 700}, {x: 2900, y: 1100}, {x: 3600, y: 900},
      {x: 3950, y: 1500}, {x: 3300, y: 2000}, {x: 3800, y: 2600}, {x: 3300, y: 3400},
      {x: 2500, y: 3100}, {x: 2100, y: 3800}, {x: 1200, y: 3600}, {x: 1400, y: 2700},
      {x: 750, y: 2400}, {x: 850, y: 1500}
    ]
  },
  {
    name: "Spa-Francorchamps Forest",
    roadWidth: 235,
    points: [
      {x: 1000, y: 800}, {x: 1900, y: 650}, {x: 2400, y: 1200}, {x: 3600, y: 900},
      {x: 4000, y: 1700}, {x: 3400, y: 2500}, {x: 3750, y: 3400}, {x: 2700, y: 3900},
      {x: 1900, y: 3300}, {x: 1300, y: 3800}, {x: 650, y: 3100}, {x: 1100, y: 2100}, {x: 700, y: 1400}
    ]
  },
  {
    name: "Interlagos Technical Twist",
    roadWidth: 205,
    points: [
      {x: 1000, y: 700}, {x: 2800, y: 650}, {x: 3700, y: 1200}, {x: 3500, y: 2100},
      {x: 2500, y: 1900}, {x: 2100, y: 2500}, {x: 3100, y: 2900}, {x: 3400, y: 3700},
      {x: 2000, y: 3850}, {x: 1200, y: 3200}, {x: 1600, y: 2300}, {x: 750, y: 1900}, {x: 700, y: 1100}
    ]
  },
  {
    name: "Nürburgring Endurance Loop",
    roadWidth: 200,
    points: [
      {x: 900, y: 650}, {x: 2100, y: 600}, {x: 2600, y: 1100}, {x: 3500, y: 700},
      {x: 4050, y: 1300}, {x: 3600, y: 2000}, {x: 4000, y: 2800}, {x: 3500, y: 3750},
      {x: 2600, y: 3400}, {x: 2100, y: 3950}, {x: 1100, y: 3800}, {x: 650, y: 3000},
      {x: 1250, y: 2500}, {x: 650, y: 1800}, {x: 1100, y: 1200}
    ]
  },
  {
    name: "Daytona Tri-Oval Superspeedway",
    roadWidth: 270,
    points: [
      {x: 1200, y: 750}, {x: 2250, y: 950}, {x: 3300, y: 750}, {x: 3950, y: 1400},
      {x: 3950, y: 2800}, {x: 3300, y: 3650}, {x: 2250, y: 3800}, {x: 1200, y: 3650},
      {x: 550, y: 2800}, {x: 550, y: 1400}
    ]
  },
  {
    name: "Laguna Seca Corkscrew",
    roadWidth: 200,
    points: [
      {x: 1100, y: 750}, {x: 2700, y: 750}, {x: 3600, y: 1300}, {x: 3400, y: 2200},
      {x: 2500, y: 2300}, {x: 2300, y: 2800}, {x: 3100, y: 3200}, {x: 2800, y: 3850},
      {x: 1400, y: 3700}, {x: 800, y: 2900}, {x: 1200, y: 2000}, {x: 750, y: 1300}
    ]
  },
  {
    name: "Abu Dhabi Yas Marina",
    roadWidth: 225,
    points: [
      {x: 900, y: 700}, {x: 3300, y: 700}, {x: 3800, y: 1200}, {x: 3100, y: 1700},
      {x: 3850, y: 2300}, {x: 3700, y: 3400}, {x: 2800, y: 3750}, {x: 2400, y: 3000},
      {x: 1800, y: 3750}, {x: 900, y: 3600}, {x: 1100, y: 2500}, {x: 650, y: 1800}
    ]
  }
];

// Catmull-Rom Spline interpolation to turn control points into smooth, dense road points
function generateSmoothTrack(raw) {
  const pts = raw.points;
  const dense = [];
  const segments = 35; // High resolution for smooth curves & accurate collision

  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[(i - 1 + pts.length) % pts.length];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % pts.length];
    const p3 = pts[(i + 2) % pts.length];

    for (let t = 0; t < segments; t++) {
      const s = t / segments;
      const s2 = s * s;
      const s3 = s2 * s;

      const x = 0.5 * (
        (2 * p1.x) +
        (-p0.x + p2.x) * s +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * s2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * s3
      );
      const y = 0.5 * (
        (2 * p1.y) +
        (-p0.y + p2.y) * s +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * s2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * s3
      );
      dense.push({ x, y });
    }
  }

  // Calculate starting angle from point 0 to point 1
  const startAngle = Math.atan2(dense[1].y - dense[0].y, dense[1].x - dense[0].x);
  return {
    name: raw.name,
    roadWidth: raw.roadWidth,
    points: dense,
    startX: dense[0].x,
    startY: dense[0].y,
    startAngle
  };
}

const tracks = rawTracks.map(generateSmoothTrack);
let currentTrack = tracks[0];

// Car object (tuned for massive high-speed Grand Prix tracks)
const car = {
  x: currentTrack.startX,
  y: currentTrack.startY,
  vx: 0,
  vy: 0,
  angle: currentTrack.startAngle,
  width: 44,
  height: 22,
  accel: 0.48,
  maxSpeed: 18,
  turnSpeed: 0.062,
  grip: 0.925,
  friction: 0.988
};

const skids = [];
let lap = 1;
let startTime = Date.now();
let bestTime = null;
let checkpoint1 = false;
let checkpoint2 = false;

function resetCarToTrack() {
  car.x = currentTrack.startX;
  car.y = currentTrack.startY;
  car.vx = 0;
  car.vy = 0;
  car.angle = currentTrack.startAngle;
  checkpoint1 = false;
  checkpoint2 = false;
  startTime = Date.now();
  canvas.focus();
}

document.getElementById('resetBtn').addEventListener('click', resetCarToTrack);

document.getElementById('trackSelect').addEventListener('change', (e) => {
  currentTrack = tracks[parseInt(e.target.value)];
  lap = 1;
  document.getElementById('lap').innerText = lap;
  bestTime = null;
  document.getElementById('best').innerText = '--';
  skids.length = 0;
  resetCarToTrack();
});

// Find closest distance from car to any road spline point
function getClosestTrackIndex(x, y) {
  let minDist = Infinity;
  let closestIdx = 0;
  const pts = currentTrack.points;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.hypot(x - pts[i].x, y - pts[i].y);
    if (d < minDist) {
      minDist = d;
      closestIdx = i;
    }
  }
  return { index: closestIdx, dist: minDist };
}

function update() {
  const up = keys['KeyW'] || keys['ArrowUp'] || keys['w'];
  const down = keys['KeyS'] || keys['ArrowDown'] || keys['s'];
  const left = keys['KeyA'] || keys['ArrowLeft'] || keys['a'];
  const right = keys['KeyD'] || keys['ArrowRight'] || keys['d'];
  const handbrake = keys['Space'] || keys[' '];

  const forwardX = Math.cos(car.angle);
  const forwardY = Math.sin(car.angle);

  let forwardSpeed = car.vx * forwardX + car.vy * forwardY;
  let rightX = -forwardY;
  let rightY = forwardX;
  let lateralSpeed = car.vx * rightX + car.vy * rightY;

  // Acceleration & Braking
  if (up) {
    forwardSpeed += car.accel;
    if (forwardSpeed > car.maxSpeed) forwardSpeed = car.maxSpeed;
  }
  if (down) {
    forwardSpeed -= car.accel * 0.8;
    if (forwardSpeed < -car.maxSpeed * 0.35) forwardSpeed = -car.maxSpeed * 0.35;
  }

  // Steering
  const totalSpeed = Math.hypot(car.vx, car.vy);
  const dir = forwardSpeed >= 0 ? 1 : -1;
  if (left) car.angle -= car.turnSpeed * dir;
  if (right) car.angle += car.turnSpeed * dir;

  // Drift physics
  const currentGrip = handbrake ? 0.945 : car.grip;
  lateralSpeed *= currentGrip;

  car.vx = forwardX * forwardSpeed + rightX * lateralSpeed;
  car.vy = forwardY * forwardSpeed + rightY * lateralSpeed;

  car.vx *= car.friction;
  car.vy *= car.friction;

  // Spline road collision check
  const closest = getClosestTrackIndex(car.x, car.y);
  const offRoad = closest.dist > (currentTrack.roadWidth / 2);

  if (offRoad) {
    car.vx *= 0.92; // Grass drag
    car.vy *= 0.92;
  }

  car.x += car.vx;
  car.y += car.vy;

  // Tire skid marks
  if ((Math.abs(lateralSpeed) > 2.3 || (handbrake && totalSpeed > 3)) && !offRoad) {
    const rearX = car.x - forwardX * 16;
    const rearY = car.y - forwardY * 16;
    skids.push({
      x1: rearX + rightX * 8, y1: rearY + rightY * 8,
      x2: rearX - rightX * 8, y2: rearY - rightY * 8
    });
    if (skids.length > 600) skids.shift();
  }

  // Multi-sector Lap Logic (prevents shortcutting across tracks)
  const totalPts = currentTrack.points.length;
  const progress = closest.index / totalPts;

  if (progress > 0.3 && progress < 0.45) checkpoint1 = true;
  if (checkpoint1 && progress > 0.65 && progress < 0.8) checkpoint2 = true;
  if (checkpoint1 && checkpoint2 && (progress > 0.95 || progress < 0.05) && closest.dist < currentTrack.roadWidth) {
    checkpoint1 = false;
    checkpoint2 = false;
    const lapTime = ((Date.now() - startTime) / 1000).toFixed(2);
    if (!bestTime || parseFloat(lapTime) < parseFloat(bestTime)) {
      bestTime = lapTime;
      document.getElementById('best').innerText = bestTime + 's';
    }
    lap++;
    startTime = Date.now();
    document.getElementById('lap').innerText = lap;
  }

  document.getElementById('time').innerText = ((Date.now() - startTime) / 1000).toFixed(2);
  document.getElementById('speed').innerText = Math.round(totalSpeed * 11.5);
}

function drawTrack() {
  // Huge 4600 x 4600 grassy infield/outfield
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, 4600, 4600);

  // Subtle grass mowing stripes/grid for speed sensation
  ctx.strokeStyle = '#264d21';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 4600; i += 150) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 4600); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(4600, i); ctx.stroke();
  }

  const pts = currentTrack.points;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Helper to trace the spline path
  function traceCircuit() {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.closePath();
  }

  // 1. Outer Red/White Curbs (Rumble Strips)
  traceCircuit();
  ctx.lineWidth = currentTrack.roadWidth + 28;
  ctx.strokeStyle = '#d93829';
  ctx.stroke();

  ctx.setLineDash([35, 35]);
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.setLineDash([]);

  // 2. Main Asphalt Surface
  traceCircuit();
  ctx.lineWidth = currentTrack.roadWidth;
  ctx.strokeStyle = '#33363b';
  ctx.stroke();

  // 3. Center Racing Line
  traceCircuit();
  ctx.lineWidth = 4;
  ctx.setLineDash([30, 30]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.stroke();
  ctx.setLineDash([]);

  // 4. Checkered Start/Finish Line rotated perpendicular to start angle
  ctx.save();
  ctx.translate(currentTrack.startX, currentTrack.startY);
  ctx.rotate(currentTrack.startAngle);
  const halfW = currentTrack.roadWidth / 2;
  const sqSize = 15;
  const rows = Math.floor(currentTrack.roadWidth / sqSize);
  for (let c = 0; c < 2; c++) {
    for (let r = 0; r < rows; r++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#111111';
      ctx.fillRect(c * sqSize - sqSize, -halfW + r * sqSize, sqSize, sqSize);
    }
  }
  ctx.restore();
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(-car.width / 2 + 5, -car.height / 2 + 5, car.width, car.height);

  ctx.fillStyle = '#111';
  ctx.fillRect(-16, -13, 10, 4);
  ctx.fillRect(8, -13, 10, 4);
  ctx.fillRect(-16, 9, 10, 4);
  ctx.fillRect(8, 9, 10, 4);

  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 5);
  ctx.fill();

  ctx.fillStyle = '#1c252c';
  ctx.fillRect(4, -8, 9, 16);
  ctx.fillRect(-14, -7, 6, 14);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-car.width / 2, -2, car.width, 4);

  ctx.fillStyle = '#fff59d';
  ctx.fillRect(car.width / 2 - 2, -8, 2, 4);
  ctx.fillRect(car.width / 2 - 2, 4, 2, 4);

  ctx.restore();
}

// Live Minimap in top-right corner so you can see upcoming hairpins
function drawMinimap() {
  const mapSize = 190;
  const padding = 20;
  const mapX = canvas.width - mapSize - padding;
  const mapY = padding;
  const scale = mapSize / 4600;

  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(mapX, mapY, mapSize, mapSize, 8);
  ctx.fill();
  ctx.stroke();

  // Draw track outline on minimap
  const pts = currentTrack.points;
  ctx.beginPath();
  ctx.moveTo(mapX + pts[0].x * scale, mapY + pts[0].y * scale);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(mapX + pts[i].x * scale, mapY + pts[i].y * scale);
  }
  ctx.closePath();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 6;
  ctx.stroke();

  // Start line marker
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(mapX + currentTrack.startX * scale - 3, mapY + currentTrack.startY * scale - 3, 6, 6);

  // Live player dot
  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  ctx.arc(mapX + car.x * scale, mapY + car.y * scale, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

  drawTrack();

  ctx.fillStyle = 'rgba(15, 15, 15, 0.45)';
  for (let s of skids) {
    ctx.fillRect(s.x1, s.y1, 4, 4);
    ctx.fillRect(s.x2, s.y2, 4, 4);
  }

  drawCar();
  ctx.restore();

  drawMinimap();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
