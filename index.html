<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Drift Racer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    canvas { display: block; outline: none; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 4px solid #ff3b30;
      pointer-events: none;
    }
    h1 { font-size: 18px; margin-bottom: 8px; letter-spacing: 1px; }
    p { font-size: 14px; margin: 4px 0; color: #ddd; }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>DRIFT CIRCUIT</h1>
  <p>Lap: <span id="lap">1</span></p>
  <p>Time: <span id="time">0.00</span>s</p>
  <p>Best: <span id="best">--</span></p>
  <p>Speed: <span id="speed">0</span> MPH</p>
</div>

<div class="controls">
  <b>W / Up:</b> Gas &nbsp;|&nbsp; <b>S / Down:</b> Brake/Reverse &nbsp;|&nbsp; <b>A / D or Left / Right:</b> Steer &nbsp;|&nbsp; <b>Space:</b> Handbrake Drift
</div>

<canvas id="game" tabindex="1"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
canvas.focus();

// Bulletproof input tracking supporting both e.code and e.key
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code) || [' ', 'w', 's', 'a', 'd', 'W', 'S', 'A', 'D'].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.code] = true;
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
  keys[e.code] = false;
  keys[e.key.toLowerCase()] = false;
});

// Car object
const car = {
  x: 1000,
  y: 450,
  vx: 0,
  vy: 0,
  angle: 0,
  width: 44,
  height: 22,
  accel: 0.4,
  maxSpeed: 14,
  turnSpeed: 0.065,
  grip: 0.92,
  friction: 0.985
};

// Track geometry
const track = {
  cx: 1000,
  cy: 1000,
  rx: 750,
  ry: 550,
  roadWidth: 220
};

const skids = [];
let lap = 1;
let startTime = Date.now();
let bestTime = null;
let passedCheckpoint = false;

function update() {
  const up = keys['KeyW'] || keys['ArrowUp'] || keys['w'];
  const down = keys['KeyS'] || keys['ArrowDown'] || keys['s'];
  const left = keys['KeyA'] || keys['ArrowLeft'] || keys['a'];
  const right = keys['KeyD'] || keys['ArrowRight'] || keys['d'];
  const handbrake = keys['Space'] || keys[' '];

  const forwardX = Math.cos(car.angle);
  const forwardY = Math.sin(car.angle);

  let forwardSpeed = car.vx * forwardX + car.vy * forwardY;
  let rightX = -forwardY;
  let rightY = forwardX;
  let lateralSpeed = car.vx * rightX + car.vy * rightY;

  // Acceleration & Braking
  if (up) {
    forwardSpeed += car.accel;
    if (forwardSpeed > car.maxSpeed) forwardSpeed = car.maxSpeed;
  }
  if (down) {
    forwardSpeed -= car.accel * 0.7;
    if (forwardSpeed < -car.maxSpeed * 0.4) forwardSpeed = -car.maxSpeed * 0.4;
  }

  // Steering
  const totalSpeed = Math.hypot(car.vx, car.vy);
  const dir = forwardSpeed >= 0 ? 1 : -1;
  if (left) car.angle -= car.turnSpeed * dir;
  if (right) car.angle += car.turnSpeed * dir;

  // Drift physics
  const currentGrip = handbrake ? 0.94 : car.grip;
  lateralSpeed *= currentGrip;

  // Reconstruct velocity
  car.vx = forwardX * forwardSpeed + rightX * lateralSpeed;
  car.vy = forwardY * forwardSpeed + rightY * lateralSpeed;

  car.vx *= car.friction;
  car.vy *= car.friction;

  // Off-road check
  const normDist = Math.hypot((car.x - track.cx) / track.rx, (car.y - track.cy) / track.ry);
  const innerLimit = 1 - (track.roadWidth / 2) / 650;
  const outerLimit = 1 + (track.roadWidth / 2) / 650;
  const offRoad = normDist < innerLimit || normDist > outerLimit;

  if (offRoad) {
    car.vx *= 0.92;
    car.vy *= 0.92;
  }

  car.x += car.vx;
  car.y += car.vy;

  // Skid marks
  if ((Math.abs(lateralSpeed) > 2.0 || (handbrake && totalSpeed > 2)) && !offRoad) {
    const rearX = car.x - forwardX * 16;
    const rearY = car.y - forwardY * 16;
    skids.push({
      x1: rearX + rightX * 8, y1: rearY + rightY * 8,
      x2: rearX - rightX * 8, y2: rearY - rightY * 8
    });
    if (skids.length > 400) skids.shift();
  }

  // Lap logic
  if (car.y > track.cy + 300 && Math.abs(car.x - track.cx) < 150) {
    passedCheckpoint = true;
  }
  if (passedCheckpoint && car.y < track.cy - 300 && Math.abs(car.x - track.cx) < 80) {
    passedCheckpoint = false;
    const lapTime = ((Date.now() - startTime) / 1000).toFixed(2);
    if (!bestTime || parseFloat(lapTime) < parseFloat(bestTime)) {
      bestTime = lapTime;
      document.getElementById('best').innerText = bestTime + 's';
    }
    lap++;
    startTime = Date.now();
    document.getElementById('lap').innerText = lap;
  }

  document.getElementById('time').innerText = ((Date.now() - startTime) / 1000).toFixed(2);
  document.getElementById('speed').innerText = Math.round(totalSpeed * 11);
}

function drawTrack() {
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, 2000, 2000);

  ctx.strokeStyle = '#264d21';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 2000; i += 100) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 2000); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(2000, i); ctx.stroke();
  }

  ctx.beginPath();
  ctx.ellipse(track.cx, track.cy, track.rx, track.ry, 0, 0, Math.PI * 2);
  ctx.lineWidth = track.roadWidth + 24;
  ctx.strokeStyle = '#d93829';
  ctx.stroke();

  ctx.setLineDash([30, 30]);
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.ellipse(track.cx, track.cy, track.rx, track.ry, 0, 0, Math.PI * 2);
  ctx.lineWidth = track.roadWidth;
  ctx.strokeStyle = '#33363b';
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(track.cx, track.cy, track.rx, track.ry, 0, 0, Math.PI * 2);
  ctx.lineWidth = 4;
  ctx.setLineDash([25, 25]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.stroke();
  ctx.setLineDash([]);

  const finishY = track.cy - track.ry;
  ctx.fillStyle = '#ffffff';
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 11; col++) {
      if ((row + col) % 2 === 0) {
        ctx.fillRect(track.cx - 10 + row * 10, finishY - 110 + col * 20, 10, 20);
      }
    }
  }
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.fillRect(-car.width / 2 + 4, -car.height / 2 + 4, car.width, car.height);

  ctx.fillStyle = '#111';
  ctx.fillRect(-16, -13, 10, 4);
  ctx.fillRect(8, -13, 10, 4);
  ctx.fillRect(-16, 9, 10, 4);
  ctx.fillRect(8, 9, 10, 4);

  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 5);
  ctx.fill();

  ctx.fillStyle = '#1c252c';
  ctx.fillRect(4, -8, 9, 16);
  ctx.fillRect(-14, -7, 6, 14);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-car.width / 2, -2, car.width, 4);

  ctx.fillStyle = '#fff59d';
  ctx.fillRect(car.width / 2 - 2, -8, 2, 4);
  ctx.fillRect(car.width / 2 - 2, 4, 2, 4);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

  drawTrack();

  ctx.fillStyle = 'rgba(15, 15, 15, 0.45)';
  for (let s of skids) {
    ctx.fillRect(s.x1, s.y1, 4, 4);
    ctx.fillRect(s.x2, s.y2, 4, 4);
  }

  drawCar();
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
